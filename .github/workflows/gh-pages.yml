name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy 404.html
        run: |
          # Vite debería copiar public/404.html automáticamente, pero lo verificamos
          if [ -f public/404.html ]; then
            cp public/404.html dist/404.html
            echo "404.html copiado exitosamente"
          else
            echo "ERROR: public/404.html no existe"
            exit 1
          fi
          # Verificar que se copió
          if [ ! -f dist/404.html ]; then
            echo "ERROR: dist/404.html no existe después de copiar"
            exit 1
          fi
          echo "404.html verificado en dist/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: false
