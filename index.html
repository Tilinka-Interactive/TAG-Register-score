<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon-zyn.ico" />
    <link rel="shortcut icon" href="/favicon-zyn.ico" />
    <link rel="apple-touch-icon" href="/favicon-zyn.ico" />
    <meta name="theme-color" content="#00a9df" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYN</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Script para manejar la redirección de GitHub Pages 404
      // Este script se ejecuta ANTES de que React cargue
      // Convierte URLs del formato ?/...~and~... de vuelta a /...&...
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Si la URL tiene el formato de GitHub Pages 404 redirect (?/...)
        // El 404.html redirige a index.html?/...~and~...
        if (search && search.startsWith('?/')) {
          // Extraer la ruta después de ?/
          var redirectPath = search.substring(2); // Remover '?/'
          
          // Convertir TODOS los ~and~ de vuelta a & primero
          redirectPath = redirectPath.replace(/~and~/g, '&');
          
          // Reconstruir la URL correctamente
          var basePath = '/TAG-Register-score';
          var newPath = basePath + '/' + redirectPath + hash;
          
          // Usar replace en lugar de replaceState para forzar recarga completa
          // Esto asegura que todos los assets se carguen correctamente
          window.location.replace(newPath);
          return; // Detener la ejecución para evitar cargar React con la URL incorrecta
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
