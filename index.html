<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon-zyn.ico" />
    <link rel="shortcut icon" href="/favicon-zyn.ico" />
    <link rel="apple-touch-icon" href="/favicon-zyn.ico" />
    <meta name="theme-color" content="#00a9df" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYN</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Script para convertir URLs de BrowserRouter a HashRouter
      // Si alguien accede con una URL sin hash, convertirla a formato hash
      (function() {
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Si no hay hash pero hay pathname que no sea solo / o /TAG-Register-score/
        // Convertir a formato hash
        if (!hash && pathname && pathname !== '/' && pathname !== '/TAG-Register-score/' && pathname !== '/TAG-Register-score') {
          // Remover el base path si existe
          var cleanPath = pathname.replace(/^\/TAG-Register-score/, '');
          if (cleanPath === '') cleanPath = '/';
          
          // Convertir a formato hash
          var newHash = '#' + cleanPath + search;
          var baseUrl = window.location.origin;
          if (pathname.startsWith('/TAG-Register-score')) {
            baseUrl += '/TAG-Register-score';
          }
          window.location.replace(baseUrl + '/' + newHash);
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
