<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZYN</title>
    <script>
      // GitHub Pages 404 redirect for HashRouter
      // Convierte la URL a formato hash (#) y redirige a index.html
      (function () {
        var l = window.location;
        var pathname = l.pathname;
        var search = l.search;
        var hash = l.hash;

        // Si ya tiene hash, solo redirigir a index.html
        if (hash && hash.startsWith("#")) {
          var redirectUrl = l.origin + "/TAG-Register-score/index.html" + hash;
          window.location.replace(redirectUrl);
          return;
        }

        // Si no tiene hash, convertir el pathname a formato hash
        // Remover el base path si existe
        var cleanPath = pathname.replace(/^\/TAG-Register-score/, "");
        if (cleanPath === "" || cleanPath === "/") {
          cleanPath = "/";
        }

        // Construir la URL con hash
        // Preservar search params si existen
        var newHash = "#" + cleanPath + (search || "");

        // Siempre incluir el base path
        var newUrl = l.origin + "/TAG-Register-score/index.html" + newHash;

        // Redirigir inmediatamente
        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body>
    <p>Redirigiendo...</p>
  </body>
</html>
